# BBG · SANDBAAD — Cloudflare Worker edition (manual deploy).
# The installer (installer/) does all of this for you from a single API token.
#
#   npm run build:worker
#   npx wrangler secret put ADMIN_PASSWORD     # 10+ characters
#   npx wrangler deploy
#
# Then open the admin link printed by:  npx wrangler tail   (or read it in the panel's first event)
name = "bbg-panel"
main = "worker/panel.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[durable_objects.bindings]]
name = "STORE"
class_name = "PanelStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PanelStore"]

[vars]
ADMIN_USER = "admin"
# Optional: fixed admin path (default: random). Example: ADMIN_PATH = "my-panel-path"
